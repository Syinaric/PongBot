<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PongBot</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --surface2: #1f2937;
      --border:   #30363d;
      --accent:   #00d4aa;
      --accent2:  #0ea5e9;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --red:      #f85149;
      --orange:   #f0883e;
      --green:    #3fb950;
      --radius:   8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .logo-icon {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .conn-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.75rem; color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 3px 9px; border-radius: 20px;
    }
    .conn-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted); transition: background .3s;
    }
    .conn-badge.connected .conn-dot    { background: var(--green); }
    .conn-badge.connected .conn-label  { color: var(--green); }
    .conn-badge.disconnected .conn-dot   { background: var(--red); }
    .conn-badge.disconnected .conn-label { color: var(--red); }

    /* ── Main 3-column grid ── */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr 270px;
      gap: 10px;
      padding: 10px;
      min-height: 0;
    }

    /* ── Shared panel style ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .panel-header {
      padding: 7px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--muted);
      display: flex; align-items: center; gap: 7px;
      flex-shrink: 0;
    }
    .live-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--red);
      animation: blink 1.4s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* ── Video panel ── */
    .video-body {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      background: #000;
      min-height: 0;
    }
    .video-body img { max-width:100%; max-height:100%; display:block; object-fit:contain; }
    .placeholder {
      color: var(--muted); font-size: .82rem; text-align: center;
    }

    /* ── 3D panel ── */
    .threejs-body {
      flex: 1;
      position: relative;
      background: #1a1a23;
      min-height: 0;
      cursor: grab;
    }
    .threejs-body:active { cursor: grabbing; }
    .threejs-body canvas { width:100% !important; height:100% !important; display:block; }
    .orbit-hint {
      position: absolute; bottom: 8px; left: 50%;
      transform: translateX(-50%);
      font-size: .68rem; color: var(--muted);
      pointer-events: none;
      background: rgba(0,0,0,.5);
      padding: 3px 8px; border-radius: 10px;
    }

    /* ── Right sidebar ── */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      min-height: 0;
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 13px;
      flex-shrink: 0;
    }
    .card-title {
      font-size: .67rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .07em;
      color: var(--muted); margin-bottom: 9px;
    }

    /* Tracking status */
    .tracking-row { display:flex; align-items:center; gap:9px; }
    .status-dot {
      width:11px; height:11px; border-radius:50%;
      background: var(--muted); flex-shrink:0;
      transition: background .3s, box-shadow .3s;
    }
    .status-dot.tracking  { background:var(--green);  box-shadow:0 0 7px var(--green); }
    .status-dot.lost      { background:var(--orange); box-shadow:0 0 7px var(--orange); }
    .status-dot.searching { background:var(--accent2);box-shadow:0 0 7px var(--accent2); }
    .status-text { font-size:.95rem; font-weight:600; }

    /* Stats grid */
    .stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .stat {
      background: var(--surface2);
      border-radius: 6px;
      padding: 8px 10px;
    }
    .stat-label { font-size:.63rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; }
    .stat-value { font-size:.95rem; font-weight:700; font-variant-numeric:tabular-nums; }
    .stat-value.red    { color:#f85149; }
    .stat-value.black  { color:var(--muted); }
    .stat-value.accent { color:var(--accent); }

    /* Divider */
    .divider {
      height: 1px; background: var(--border);
      margin: 2px 0; flex-shrink: 0;
    }

    /* Toggle rows */
    .section-label {
      font-size: .67rem; font-weight:600;
      text-transform:uppercase; letter-spacing:.07em;
      color: var(--muted); margin-bottom: 7px;
    }
    .toggle-row {
      display:flex; align-items:center;
      justify-content:space-between; gap:8px;
      margin-bottom: 5px;
    }
    .toggle-row:last-child { margin-bottom: 0; }
    .toggle-row label { font-size:.82rem; cursor:pointer; user-select:none; flex:1; }
    .switch { position:relative; width:34px; height:18px; flex-shrink:0; }
    .switch input { opacity:0; width:0; height:0; position:absolute; }
    .switch-track {
      position:absolute; inset:0;
      background:var(--surface2); border:1px solid var(--border);
      border-radius:18px; cursor:pointer;
      transition: background .2s, border-color .2s;
    }
    .switch-track::after {
      content:""; position:absolute;
      top:2px; left:2px; width:12px; height:12px;
      border-radius:50%; background:var(--muted);
      transition: left .2s, background .2s;
    }
    .switch input:checked + .switch-track { background:var(--accent); border-color:var(--accent); }
    .switch input:checked + .switch-track::after { left:18px; background:#fff; }

    /* Sliders */
    .slider-row { margin-bottom: 8px; }
    .slider-row:last-child { margin-bottom: 0; }
    .slider-header { display:flex; justify-content:space-between; font-size:.8rem; margin-bottom:4px; }
    .slider-val { font-variant-numeric:tabular-nums; font-weight:600; color:var(--accent); min-width:32px; text-align:right; }
    input[type="range"] {
      -webkit-appearance:none; width:100%; height:3px;
      background:var(--surface2); border:1px solid var(--border);
      border-radius:3px; outline:none; cursor:pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance:none; width:13px; height:13px;
      border-radius:50%; background:var(--accent); cursor:pointer;
    }

    .save-toast {
      position:fixed; bottom:16px; right:16px;
      background:var(--surface); border:1px solid var(--accent);
      color:var(--accent); padding:6px 14px; border-radius:20px;
      font-size:.75rem; font-weight:600;
      opacity:0; transition:opacity .3s; pointer-events:none;
    }
    .save-toast.show { opacity:1; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🏓</div>
    PongBot
  </div>
  <div class="conn-badge" id="connBadge">
    <div class="conn-dot"></div>
    <span class="conn-label" id="connLabel">Connecting…</span>
  </div>
</header>

<main>
  <!-- ── Left: Camera feed ── -->
  <div class="panel">
    <div class="panel-header"><div class="live-dot"></div>Live Feed</div>
    <div class="video-body">
      <img id="videoFeed" alt="Camera feed" style="display:none">
      <div class="placeholder" id="placeholder">Starting camera…</div>
    </div>
  </div>

  <!-- ── Centre: 3D Paddle ── -->
  <div class="panel">
    <div class="panel-header">3D View</div>
    <div class="threejs-body" id="threejsBody">
      <div class="orbit-hint" id="orbitHint">Drag to orbit</div>
    </div>
  </div>

  <!-- ── Right: Sidebar ── -->
  <div class="sidebar">

    <!-- Tracking status -->
    <div class="card">
      <div class="card-title">Status</div>
      <div class="tracking-row">
        <div class="status-dot" id="statusDot"></div>
        <div class="status-text" id="statusText">—</div>
      </div>
    </div>

    <!-- Detection stats -->
    <div class="card">
      <div class="card-title">Detection</div>
      <div class="stats-grid">
        <div class="stat">
          <div class="stat-label">Side</div>
          <div class="stat-value" id="statSide">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Distance</div>
          <div class="stat-value accent" id="statDist">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">FPS</div>
          <div class="stat-value accent" id="statFps">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Hand</div>
          <div class="stat-value" id="statHand">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">Lost</div>
          <div class="stat-value" id="statLost">—</div>
        </div>
        <div class="stat">
          <div class="stat-label">YOLO</div>
          <div class="stat-value accent" id="statYolo">—</div>
        </div>
      </div>
    </div>

    <!-- Feature toggles -->
    <div class="card">
      <div class="section-label">Features</div>
      <div class="toggle-row">
        <label for="togYolo">YOLO Detection</label>
        <label class="switch"><input type="checkbox" id="togYolo" data-config="yolo_enabled"><span class="switch-track"></span></label>
      </div>
      <div class="toggle-row">
        <label for="togHand">Hand Detection</label>
        <label class="switch"><input type="checkbox" id="togHand" data-config="hand_detection_enabled"><span class="switch-track"></span></label>
      </div>
      <div class="toggle-row">
        <label for="togDebug">Debug Overlays</label>
        <label class="switch"><input type="checkbox" id="togDebug" data-config="debug_mode"><span class="switch-track"></span></label>
      </div>
    </div>

    <!-- Overlay toggles -->
    <div class="card">
      <div class="section-label">Overlays</div>
      <div class="toggle-row">
        <label for="togContours">Contours</label>
        <label class="switch"><input type="checkbox" id="togContours" data-config="show_contours"><span class="switch-track"></span></label>
      </div>
      <div class="toggle-row">
        <label for="togAxes">3D Axes</label>
        <label class="switch"><input type="checkbox" id="togAxes" data-config="show_axes"><span class="switch-track"></span></label>
      </div>
      <div class="toggle-row">
        <label for="togDepth">Depth Label</label>
        <label class="switch"><input type="checkbox" id="togDepth" data-config="show_depth"><span class="switch-track"></span></label>
      </div>
      <div class="toggle-row">
        <label for="togHandSkel">Hand Skeleton</label>
        <label class="switch"><input type="checkbox" id="togHandSkel" data-config="show_hand"><span class="switch-track"></span></label>
      </div>
    </div>

    <!-- Sliders -->
    <div class="card">
      <div class="section-label">Tuning</div>
      <div class="slider-row">
        <div class="slider-header"><span>Smoothing</span><span class="slider-val" id="valSmoothing">0.50</span></div>
        <input type="range" id="sldSmoothing" data-config="smoothing_alpha" min="0.01" max="1.0" step="0.01" value="0.50">
      </div>
      <div class="slider-row">
        <div class="slider-header"><span>YOLO Confidence</span><span class="slider-val" id="valYoloConf">0.40</span></div>
        <input type="range" id="sldYoloConf" data-config="yolo_confidence" min="0.1" max="0.95" step="0.01" value="0.40">
      </div>
      <div class="section-label" style="margin-top:8px">Black Rubber</div>
      <div class="slider-row">
        <div class="slider-header"><span>Max Saturation</span><span class="slider-val" id="valBlackSat">80</span></div>
        <input type="range" id="sldBlackSat" data-config="black_sat_max" min="20" max="200" step="1" value="80">
      </div>
      <div class="slider-row">
        <div class="slider-header"><span>Max Value</span><span class="slider-val" id="valBlackVal">60</span></div>
        <input type="range" id="sldBlackVal" data-config="black_val_max" min="10" max="180" step="1" value="60">
      </div>
    </div>

  </div><!-- /sidebar -->
</main>

<div class="save-toast" id="saveToast">Saved</div>

<script>
// ════════════════════════════════════════════════════════════
//  Three.js – 3D Paddle View
// ════════════════════════════════════════════════════════════
(function () {
  const container = document.getElementById('threejsBody');
  const orbitHint = document.getElementById('orbitHint');

  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x1a1a23);
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();

  // Camera
  const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 10);

  // Lights (match OpenGL setup)
  scene.add(new THREE.AmbientLight(0xffffff, 0.30));
  const dirLight = new THREE.DirectionalLight(0xd9d9de, 0.85);
  dirLight.position.set(2, 3, 4);
  scene.add(dirLight);

  // ── Paddle geometry ──────────────────────────────────────
  const HW  = 0.075;   // head half-width
  const HH  = 0.0825;  // head half-height
  const HT  = 0.003;   // half-thickness
  const HL  = 0.085;   // handle length
  const HW2 = 0.0125;  // handle half-width

  // Ellipse shape for extrude
  const ellipseShape = new THREE.Shape();
  const N = 72;
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * Math.PI * 2;
    const x = HW * Math.cos(a), y = HH * Math.sin(a);
    i === 0 ? ellipseShape.moveTo(x, y) : ellipseShape.lineTo(x, y);
  }

  // Front face (flat, facing +Z)
  const frontGeo = new THREE.ShapeGeometry(ellipseShape, N);
  const frontMat = new THREE.MeshPhongMaterial({ color: 0xd11a1a, side: THREE.FrontSide });
  const frontMesh = new THREE.Mesh(frontGeo, frontMat);
  frontMesh.position.z = HT;

  // Back face – rotate π around Y so its normal points -Z, matching the Python flip
  const backGeo  = new THREE.ShapeGeometry(ellipseShape, N);
  const backMat  = new THREE.MeshPhongMaterial({ color: 0x111111, side: THREE.FrontSide });
  const backMesh = new THREE.Mesh(backGeo, backMat);
  backMesh.position.z = -HT;
  backMesh.rotation.y = Math.PI;   // flip face to look in -Z direction

  // Edge band (custom quad strip around ellipse perimeter)
  // Winding: CCW from outside so faces are front-facing toward camera
  const edgePosArr = [], edgeNormArr = [], edgeIdx = [];
  for (let i = 0; i <= N; i++) {
    const a  = (i / N) * Math.PI * 2;
    const cx = HW * Math.cos(a), cy = HH * Math.sin(a);
    const nx = Math.cos(a) / HW, ny = Math.sin(a) / HH;
    const nl = Math.hypot(nx, ny) || 1;
    edgePosArr.push(cx, cy,  HT,  cx, cy, -HT);   // [i*2]=top, [i*2+1]=bottom
    edgeNormArr.push(nx/nl, ny/nl, 0,  nx/nl, ny/nl, 0);
  }
  for (let i = 0; i < N; i++) {
    const a = i * 2, b = (i + 1) * 2;
    // CCW from outside: top0, bottom0, top1 / bottom0, bottom1, top1
    edgeIdx.push(a, a+1, b,   a+1, b+1, b);
  }
  const edgeGeo = new THREE.BufferGeometry();
  edgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgePosArr, 3));
  edgeGeo.setAttribute('normal',   new THREE.Float32BufferAttribute(edgeNormArr, 3));
  edgeGeo.setIndex(edgeIdx);
  const edgeMat  = new THREE.MeshPhongMaterial({ color: 0x9e7a3e, side: THREE.DoubleSide });
  const edgeMesh = new THREE.Mesh(edgeGeo, edgeMat);

  // Handle (box)
  const handleGeo  = new THREE.BoxGeometry(HW2 * 2, HL, HT * 2);
  const handleMat  = new THREE.MeshPhongMaterial({ color: 0x8c6530 });
  const handleMesh = new THREE.Mesh(handleGeo, handleMat);
  handleMesh.position.set(0, -HH - HL / 2, 0);

  // Group
  const paddle = new THREE.Group();
  paddle.add(frontMesh, backMesh, edgeMesh, handleMesh);
  scene.add(paddle);

  // ── Grid (orbit mode) ────────────────────────────────────
  function makeGrid() {
    const pts = [];
    for (let i = -5; i <= 5; i++) {
      const v = i * 0.1;
      pts.push(-0.5, v, -0.15,   0.5, v, -0.15);
      pts.push(v, -0.5, -0.15,   v,  0.5, -0.15);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x404050 }));
  }

  // Grid (POV mode) at z = -0.5
  function makePovGrid() {
    const pts = [];
    for (let i = -8; i <= 8; i++) {
      const v = i * 0.1;
      pts.push(v, -0.4, -0.5,   v,  0.4, -0.5);
      pts.push(-0.8, v, -0.5,   0.8, v, -0.5);
    }
    // Axes at z=-0.5
    pts.push(0,0,-0.5, 0.15,0,-0.5);   // X red
    pts.push(0,0,-0.5, 0,0.15,-0.5);   // Y green
    pts.push(0,0,-0.5, 0,0,-0.35);      // Z blue
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    const colors = [];
    const dim = [0.22, 0.22, 0.28];
    const nGridPts = (17 * 4) * 2; // 17 lines × 2 ends × 2 verts each... simpler: just color all gray then axes
    for (let i = 0; i < pts.length / 3; i++) colors.push(...dim);
    // Override last 6 vertices (3 axis lines × 2 pts) with proper colors
    const base = pts.length / 3 - 6;
    const axColors = [[0.9,0.2,0.2],[0.9,0.2,0.2], [0.2,0.9,0.2],[0.2,0.9,0.2], [0.3,0.5,1.0],[0.3,0.5,1.0]];
    for (let i = 0; i < 6; i++) {
      colors[(base + i) * 3]     = axColors[i][0];
      colors[(base + i) * 3 + 1] = axColors[i][1];
      colors[(base + i) * 3 + 2] = axColors[i][2];
    }
    g.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors: true }));
  }

  const orbitGrid = makeGrid();
  const povGrid   = makePovGrid();
  scene.add(orbitGrid);
  scene.add(povGrid);

  // ── Camera intrinsics projection ──────────────────────────
  function buildIntrinsicsProjection(fx, fy, cx, cy, W, H, near, far) {
    const n = near, f = far;
    const P = new THREE.Matrix4();
    P.set(
      2*fx/W,  0,       (W - 2*cx)/W,   0,
      0,       2*fy/H,  -(H - 2*cy)/H,  0,
      0,       0,       -(f+n)/(f-n),   -2*f*n/(f-n),
      0,       0,       -1,              0
    );
    return P;
  }

  // ── Rodrigues rotation (OpenCV) → THREE.Matrix3 ──────────
  function rodrigues(rv) {
    const angle = Math.sqrt(rv[0]**2 + rv[1]**2 + rv[2]**2);
    const m = new THREE.Matrix3();
    if (angle < 1e-10) return m;
    const [kx, ky, kz] = [rv[0]/angle, rv[1]/angle, rv[2]/angle];
    const c = Math.cos(angle), s = Math.sin(angle), t = 1 - c;
    // set() is row-major
    m.set(
      t*kx*kx+c,       t*kx*ky - s*kz,  t*kx*kz + s*ky,
      t*kx*ky + s*kz,  t*ky*ky + c,     t*ky*kz - s*kx,
      t*kx*kz - s*ky,  t*ky*kz + s*kx,  t*kz*kz + c
    );
    return m;
  }

  // Apply flip F=diag(1,-1,-1): R_gl = F @ R_cv @ F
  function flipMatrix(R) {
    // elements stored column-major: elements[col*3+row]
    const e = R.elements.slice();
    const signs = [1, -1, -1];
    for (let row = 0; row < 3; row++)
      for (let col = 0; col < 3; col++)
        e[col*3 + row] = R.elements[col*3 + row] * signs[row] * signs[col];
    R.elements.set(e);
    return R;
  }

  function buildPoseMatrix(rvec, tvec) {
    const R_cv = rodrigues(rvec);
    const R_gl = flipMatrix(R_cv);
    const e = R_gl.elements; // column-major
    const tx = tvec[0], ty = -tvec[1], tz = -tvec[2];
    // Build Matrix4 row-major: set(row0, row1, row2, row3)
    const M = new THREE.Matrix4();
    M.set(
      e[0], e[3], e[6], tx,
      e[1], e[4], e[7], ty,
      e[2], e[5], e[8], tz,
      0,    0,    0,    1
    );
    return M;
  }

  // ── State ────────────────────────────────────────────────
  let orbitX = 20, orbitY = -30;
  let isTracking = false;

  function updateColors(side) {
    if (side === 'red') {
      frontMat.color.setHex(0xd11a1a);
      backMat.color.setHex(0x111111);
    } else {
      frontMat.color.setHex(0x111111);
      backMat.color.setHex(0xd11a1a);
    }
  }

  function applyPose(data) {
    isTracking = data.is_tracking && data.rvec && data.tvec;
    updateColors(data.visible_side || 'red');

    if (isTracking) {
      orbitHint.style.display = 'none';
      // POV-locked: camera at origin, paddle at solvePnP pose
      camera.position.set(0, 0, 0);
      camera.up.set(0, 1, 0);
      camera.lookAt(0, 0, -1);
      camera.projectionMatrix.copy(
        buildIntrinsicsProjection(600, 600, 320, 240, 640, 480, 0.01, 10.0)
      );
      camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();

      orbitGrid.visible = false;
      povGrid.visible = true;

      paddle.matrixAutoUpdate = false;
      paddle.matrix.copy(buildPoseMatrix(data.rvec, data.tvec));

    } else {
      orbitHint.style.display = 'block';
      // Orbit mode
      camera.position.set(0, 0, 0.9);
      camera.up.set(0, 1, 0);
      camera.lookAt(0, 0, 0);
      camera.aspect = container.clientWidth / (container.clientHeight || 1);
      camera.fov = 45;
      camera.updateProjectionMatrix();

      orbitGrid.visible = true;
      povGrid.visible = false;

      paddle.matrixAutoUpdate = true;
      paddle.position.set(0, 0, 0);
      paddle.rotation.set(
        THREE.MathUtils.degToRad(orbitX),
        THREE.MathUtils.degToRad(orbitY),
        0
      );
    }
  }

  // ── Resize handling ───────────────────────────────────────
  function resize() {
    const w = container.clientWidth, h = container.clientHeight;
    renderer.setSize(w, h, false);
    if (!isTracking) {
      camera.aspect = w / (h || 1);
      camera.updateProjectionMatrix();
    }
  }
  new ResizeObserver(resize).observe(container);
  resize();
  setTimeout(resize, 200); // rerun after DOM layout fully settles

  // ── Mouse orbit ───────────────────────────────────────────
  let dragging = false, lastX = 0, lastY = 0;
  container.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener('mouseup', () => { dragging = false; });
  window.addEventListener('mousemove', e => {
    if (!dragging || isTracking) return;
    orbitY += (e.clientX - lastX) * 0.5;
    orbitX = Math.max(-89, Math.min(89, orbitX + (e.clientY - lastY) * 0.5));
    lastX = e.clientX; lastY = e.clientY;
  });

  // ── Render loop ───────────────────────────────────────────
  function animate() {
    requestAnimationFrame(animate);
    if (!isTracking) {
      paddle.rotation.set(
        THREE.MathUtils.degToRad(orbitX),
        THREE.MathUtils.degToRad(orbitY),
        0
      );
    }
    renderer.render(scene, camera);
  }
  animate();

  // ── Poll /api/pose ────────────────────────────────────────
  async function pollPose() {
    try {
      const r = await fetch('/api/pose');
      if (r.ok) applyPose(await r.json());
    } catch {}
  }
  setInterval(pollPose, 50);
  pollPose();
})();


// ════════════════════════════════════════════════════════════
//  Live video feed (JS snapshot polling)
// ════════════════════════════════════════════════════════════
(function () {
  const img = document.getElementById('videoFeed');
  const ph  = document.getElementById('placeholder');
  let errors = 0;

  function fetchFrame() {
    fetch('/snapshot?' + Date.now())
      .then(r => r.status === 204 ? null : r.blob())
      .then(blob => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const old = img.src;
        img.src = url;
        if (img.style.display === 'none') { img.style.display = 'block'; ph.style.display = 'none'; }
        img.onload = () => { if (old.startsWith('blob:')) URL.revokeObjectURL(old); };
        errors = 0;
      })
      .catch(() => { if (++errors > 5) { ph.style.display='block'; img.style.display='none'; ph.textContent='Camera unavailable'; } });
  }
  setInterval(fetchFrame, 40);
  fetchFrame();
})();


// ════════════════════════════════════════════════════════════
//  Status polling
// ════════════════════════════════════════════════════════════
(function () {
  const connBadge  = document.getElementById('connBadge');
  const connLabel  = document.getElementById('connLabel');
  const statusDot  = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const statSide   = document.getElementById('statSide');
  const statDist   = document.getElementById('statDist');
  const statFps    = document.getElementById('statFps');
  const statHand   = document.getElementById('statHand');
  const statYolo   = document.getElementById('statYolo');
  const statLost   = document.getElementById('statLost');

  async function pollStatus() {
    try {
      const r = await fetch('/api/status');
      if (!r.ok) throw new Error();
      const d = await r.json();

      connBadge.className = 'conn-badge connected';
      connLabel.textContent = 'Connected';

      if (d.is_tracking) {
        statusDot.className = 'status-dot tracking';
        statusText.textContent = 'Tracking';
      } else if (d.frames_lost > 0) {
        statusDot.className = 'status-dot lost';
        statusText.textContent = `Lost (${d.frames_lost}f)`;
      } else {
        statusDot.className = 'status-dot searching';
        statusText.textContent = 'Searching…';
      }

      statSide.textContent = d.visible_side ? d.visible_side.toUpperCase() : '—';
      statSide.className   = 'stat-value ' + (d.visible_side === 'red' ? 'red' : d.visible_side === 'black' ? 'black' : '');
      statDist.textContent = d.distance !== null ? d.distance.toFixed(2) + ' m' : '—';
      statFps.textContent  = d.fps != null ? d.fps.toFixed(1) : '—';
      statHand.textContent = d.hand_detected ? '✓ Yes' : '✗ No';
      statHand.style.color = d.hand_detected ? 'var(--green)' : 'var(--muted)';
      statYolo.textContent = d.yolo_detections;
      statLost.textContent = d.frames_lost;
    } catch {
      connBadge.className = 'conn-badge disconnected';
      connLabel.textContent = 'Disconnected';
    }
  }
  setInterval(pollStatus, 500);
  pollStatus();
})();


// ════════════════════════════════════════════════════════════
//  Config controls
// ════════════════════════════════════════════════════════════
(function () {
  const toast = document.getElementById('saveToast');
  let toastTimer;
  function showSaved() {
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
  }

  async function sendConfig(key, value) {
    try {
      await fetch('/api/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ [key]: value }),
      });
      showSaved();
    } catch {}
  }

  const sliders = {
    sldSmoothing: { valId: 'valSmoothing', fmt: v => parseFloat(v).toFixed(2), cfg: 'smoothing_alpha' },
    sldYoloConf:  { valId: 'valYoloConf',  fmt: v => parseFloat(v).toFixed(2), cfg: 'yolo_confidence' },
    sldBlackSat:  { valId: 'valBlackSat',  fmt: v => parseInt(v),              cfg: 'black_sat_max' },
    sldBlackVal:  { valId: 'valBlackVal',  fmt: v => parseInt(v),              cfg: 'black_val_max' },
  };
  const toggles = {
    togYolo:     'yolo_enabled',
    togHand:     'hand_detection_enabled',
    togDebug:    'debug_mode',
    togContours: 'show_contours',
    togAxes:     'show_axes',
    togDepth:    'show_depth',
    togHandSkel: 'show_hand',
  };

  // Load initial config
  fetch('/api/config').then(r => r.json()).then(cfg => {
    for (const [id, meta] of Object.entries(sliders)) {
      const el = document.getElementById(id);
      if (cfg[meta.cfg] !== undefined) {
        el.value = cfg[meta.cfg];
        document.getElementById(meta.valId).textContent = meta.fmt(cfg[meta.cfg]);
      }
    }
    for (const [id, key] of Object.entries(toggles)) {
      const el = document.getElementById(id);
      if (cfg[key] !== undefined) el.checked = cfg[key];
    }
  }).catch(() => {});

  // Wire sliders
  for (const [id, meta] of Object.entries(sliders)) {
    document.getElementById(id).addEventListener('input', function () {
      document.getElementById(meta.valId).textContent = meta.fmt(this.value);
      sendConfig(meta.cfg, parseFloat(this.value));
    });
  }

  // Wire toggles
  for (const [id, key] of Object.entries(toggles)) {
    document.getElementById(id).addEventListener('change', function () {
      sendConfig(key, this.checked);
    });
  }
})();
</script>
</body>
</html>
